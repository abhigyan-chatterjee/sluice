[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sluice"
version = "1.0.0"
description = "Tiered free-first web search and extraction router and backend manager for Hermes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Abhigyan Chatterjee" }]
dependencies = [
    "httpx>=0.27,<1",
    "trafilatura>=1.8,<3",
    "playwright>=1.45,<2",
    "ddgs>=9,<10",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sluice = "sluice.cli:main"

[tool.setuptools.packages.find]
include = ["sluice*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
