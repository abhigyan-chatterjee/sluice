name: sluice-search
version: "1.0.0"
description: "Tiered free-first web search and extraction router and backend manager for Hermes"
author: Abhigyan Chatterjee
license: MIT
kind: backend
manifest_version: 2
requires_hermes: ">=0.22.5"
provides_web_providers:
  - sluice-search
python_dependencies:
  - "httpx>=0.27,<1"
  - "trafilatura>=1.8,<3"
  - "playwright>=1.45,<2"
  - "ddgs>=9,<10"
capabilities: []
# Every `description` below is shown verbatim in Settings > Plugins and in the desktop
# pane. They are user-facing copy: no internal document names, no line references, no
# task ids. Provenance for a maintainer lives in the source docstrings, not here.
config_schema:
  tier_order: {type: str, default: "local,keyless,free,paid", label: "Tier order", description: "Order in which cost tiers are tried, cheapest first. A comma-separated subset of local, keyless, free and paid."}
  keyless_enabled: {type: bool, default: true, label: "Keyless tiers", description: "Allow the public anonymous engines that need no API key: ddgs, and the keyless modes of Exa, Parallel, Firecrawl, Tavily and Keenable."}
  per_backend_budget_ms: {type: int, default: 2500, label: "Per-backend budget (ms)", description: "How long one backend gets to answer before the next candidate is tried."}
  total_budget_ms: {type: int, default: 8000, label: "Total budget (ms)", description: "How long one whole search may take across every backend it tries."}
  search_ttl_general: {type: int, default: 900, label: "Search TTL, general (s)", description: "How long a cached search result stays fresh for ordinary queries."}
  search_ttl_news: {type: int, default: 300, label: "Search TTL, news (s)", description: "How long a cached search result stays fresh for news queries, which go stale faster."}
  extract_ttl: {type: int, default: 3600, label: "Extract TTL (s)", description: "How long extracted page content is cached, per URL and format."}
  negative_ttl: {type: int, default: 60, label: "Negative cache TTL (s)", description: "How long a URL that failed to fetch is remembered as failed, so it is not retried immediately."}
  domain_memory_ttl: {type: int, default: 86400, label: "Domain memory TTL (s)", description: "How long a domain that answered with a bot challenge is remembered, so the browser stage is used straight away next time."}
  circuit_failures: {type: int, default: 3, label: "Circuit failures", description: "Consecutive failures that take a backend out of rotation."}
  circuit_open_seconds: {type: int, default: 900, label: "Circuit open (s)", description: "How long a backend stays out of rotation after it trips the failure limit."}
  circuit_quota_seconds: {type: int, default: 3600, label: "Quota open (s)", description: "How long a backend stays out of rotation after it reports its quota is exhausted."}
  cache_max_mb: {type: int, default: 200, label: "Cache cap (MB)", description: "Size at which the cache starts evicting its least recently used entries."}
  searxng_url: {type: str, default: "", label: "SearXNG URL", description: "Base URL of a SearXNG instance you run yourself, with search.formats set to [html, json]. Leave empty to disable the local tier. A malformed URL is refused with the reason."}
  plan_exa: {type: str, default: "free", label: "Plan: Exa", description: "Whether your Exa key is on the free allowance or a paid plan. This only affects routing order."}
  plan_parallel: {type: str, default: "paid", label: "Plan: Parallel", description: "Whether your Parallel key is on the free allowance or a paid plan. This only affects routing order."}
  plan_firecrawl: {type: str, default: "free", label: "Plan: Firecrawl", description: "Whether your Firecrawl key is on the free allowance or a paid plan. This only affects routing order."}
  plan_tavily: {type: str, default: "free", label: "Plan: Tavily", description: "Whether your Tavily key is on the free allowance or a paid plan. This only affects routing order."}
  plan_keenable: {type: str, default: "paid", label: "Plan: Keenable", description: "Whether your Keenable key is on the free allowance or a paid plan. This only affects routing order."}
  plan_brave: {type: str, default: "free", label: "Plan: Brave", description: "Whether your Brave key is on the free allowance or a paid plan. This only affects routing order."}
  plan_perplexity: {type: str, default: "paid", label: "Plan: Perplexity", description: "Whether your Perplexity key is on the free allowance or a paid plan. This only affects routing order."}
  plan_xai: {type: str, default: "paid", label: "Plan: xAI", description: "Whether your xAI key is on the free allowance or a paid plan. This only affects routing order."}
  plan_deepseek: {type: str, default: "paid", label: "Plan: DeepSeek", description: "Whether your DeepSeek key is on the free allowance or a paid plan. This only affects routing order."}
  plan_tinyfish: {type: str, default: "paid", label: "Plan: TinyFish", description: "Whether your TinyFish key is on the free allowance or a paid plan. This only affects routing order."}
  exa_api_key: {type: secret, env: EXA_API_KEY, description: "Exa API key. Optional: the keyless MCP tier works without one."}
  parallel_api_key: {type: secret, env: PARALLEL_API_KEY, description: "Parallel API key. Optional: the keyless MCP tier works without one."}
  firecrawl_api_key: {type: secret, env: FIRECRAWL_API_KEY, description: "Firecrawl API key. Optional: the keyless tier works without one."}
  tavily_api_key: {type: secret, env: TAVILY_API_KEY, description: "Tavily API key. Optional: the keyless tier works without one."}
  keenable_api_key: {type: secret, env: KEENABLE_API_KEY, description: "Keenable API key. Optional: the public endpoint works without one."}
  brave_api_key: {type: secret, env: BRAVE_API_KEY, description: "Brave Search API key. This is not the same key as BRAVE_SEARCH_API_KEY."}
  perplexity_api_key: {type: secret, env: PERPLEXITY_API_KEY, description: "Perplexity API key."}
  xai_api_key: {type: secret, env: XAI_API_KEY, description: "xAI API key. Search through xAI is LLM-mediated and can be unreliable."}
  deepseek_api_key: {type: secret, env: DEEPSEEK_API_KEY, description: "DeepSeek API key. Paid, and billed per successful request."}
  tinyfish_api_key: {type: secret, env: TINYFISH_API_KEY, description: "TinyFish API key. Paid."}
